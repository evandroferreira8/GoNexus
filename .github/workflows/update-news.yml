name: Atualizar notícias e busca GO Nexus

on:
  schedule:
    - cron: '17 10,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: go-nexus-news
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'
      - name: Atualizar notícias oficiais
        run: python scripts/update_news.py
      - name: Reconstruir índice de busca
        run: python scripts/build_search_index.py
      - name: Salvar apenas se houver alterações
        run: |
          git add news.json search-index.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Atualiza notícias oficiais e índice de busca'
            git push
          else
            echo 'Nenhuma alteração necessária.'
          fi
