name: Verificar ferramentas GO Nexus

on:
  push:
    branches: [main, go-nexus-v2-redesign, nexus-studio-mobile-20261012]
    paths:
      - '*.html'
      - '*.js'
      - '*.json'
      - '.github/workflows/check-site.yml'
      - 'scripts/smoke-test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-nexus-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador para testes
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Iniciar servidor local
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/go-nexus-server.log 2>&1 &
          sleep 2
      - name: Testar todas as páginas
        run: node scripts/smoke-test.mjs
