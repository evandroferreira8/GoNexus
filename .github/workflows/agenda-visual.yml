name: Agenda GO — visual responsivo

on:
  push:
    branches: [main, feat/agenda-mobile-semana-primeiro]
    paths:
      - agenda.html
      - agenda-eventos.json
      - scripts/agenda-visual-test.mjs
      - .github/workflows/agenda-visual.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agenda-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright e Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Subir servidor local
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/agenda-server.log 2>&1 &
          sleep 2
      - name: Verificar desktop e celular
        run: node scripts/agenda-visual-test.mjs
      - name: Salvar capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-responsive-screenshots
          path: /tmp/agenda-visual/*.png
          if-no-files-found: ignore
