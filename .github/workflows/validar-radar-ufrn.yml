name: Validar protótipo Radar UFRN
on:
  push:
    branches: [experimento/radar-ufrn]
    paths:
      - 'radar-ufrn/extension/**'
      - 'radar-ufrn.html'
      - 'nav.js'
      - '.github/workflows/validar-radar-ufrn.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar JavaScript
        run: |
          for js in radar-ufrn/extension/*.js nav.js; do node --check "$js"; done
      - name: Testar lógica de consulta manual
        run: node radar-ufrn/test-manual.mjs
      - name: Verificar manifesto e pagina
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          folder=Path('radar-ufrn/extension')
          manifest=json.loads((folder/'manifest.json').read_text())
          assert manifest['manifest_version']==3
          for spec in manifest['content_scripts']:
              for js in spec['js']:
                  assert (folder/js).is_file(), f'Arquivo ausente: {js}'
          assert (folder/manifest['background']['service_worker']).is_file()
          assert 'radar-ufrn.html' in Path('nav.js').read_text()
          page=Path('radar-ufrn.html').read_text()
          assert 'go-nexus-header' in page and 'go-nexus-radar-web' in page
          assert 'Não conectado' in page
          print('Manifesto, menu e página verificados.')
          PY
      - name: Empacotar extensão experimental
        run: |
          cd radar-ufrn/extension
          zip -q -r ../../radar-ufrn-brave-experimental.zip manifest.json background.js page-hook.js map-content.js nexus-bridge.js popup.html popup.js
      - name: Disponibilizar extensão ZIP
        uses: actions/upload-artifact@v4
        with:
          name: radar-ufrn-extensao-brave
          path: radar-ufrn-brave-experimental.zip
          retention-days: 14
